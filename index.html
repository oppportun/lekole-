<style>
:root{color-scheme:light}
html{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}

<style>
/* Concept : application mobile d'apprentissage, une colonne, cartes de cours, leçons courtes avec quiz.
   Détail propre au sujet : liseré aux couleurs du drapeau centrafricain sous l'en-tête. */
:root {
  --bg: #F3F5F9;
  --surface: #FFFFFF;
  --fg: #14213D;
  --muted: #566277;
  --line: #DCE1EB;
  --accent: #1B4FA8;
  --accent-fg: #FFFFFF;
  --soft: #E5ECF9;
  --sun: #E3A900;
  --sun-soft: #FBF0CC;
  --ok: #1E8E5A;
  --ok-soft: #DDF3E8;
  --bad: #BF3A3A;
  --bad-soft: #F9E1E1;
  --f-blue: #1B4FA8;
  --f-green: #2C9A4B;
  --f-yellow: #F2C200;
  --f-red: #D32F2F;
  --font: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0E1424; --surface: #161E33; --fg: #E8ECF5; --muted: #9AA5BC; --line: #26304A;
    --accent: #7BA5FF; --accent-fg: #0E1424; --soft: #1C2A4D;
    --sun: #F5C842; --sun-soft: #3A3115;
    --ok: #4CC38A; --ok-soft: #14352A; --bad: #F08080; --bad-soft: #3D1D22;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0E1424; --surface: #161E33; --fg: #E8ECF5; --muted: #9AA5BC; --line: #26304A;
  --accent: #7BA5FF; --accent-fg: #0E1424; --soft: #1C2A4D;
  --sun: #F5C842; --sun-soft: #3A3115;
  --ok: #4CC38A; --ok-soft: #14352A; --bad: #F08080; --bad-soft: #3D1D22;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--fg); font: 16px/1.55 var(--font); }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--bg); }
.wrap {
  max-width: 720px; margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
a { color: var(--accent); }
a:focus-visible, button:focus-visible, input:focus-visible, .opt:focus-within { outline: 3px solid var(--sun); outline-offset: 2px; }
h1, h2, h3 { line-height: 1.2; text-wrap: balance; margin: 0; letter-spacing: -0.01em; }
h1 { font-size: 1.7rem; font-weight: 800; }
h2 { font-size: 1.2rem; font-weight: 700; }
h3 { font-size: 1.02rem; font-weight: 700; }
p { margin: 0; }

/* En-tête */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--bg); }
.top .wrap { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding-block: 12px; }
.brand { text-decoration: none; font-weight: 800; font-size: 1.15rem; color: var(--fg); letter-spacing: -0.01em; }
.brand b { color: var(--accent); font-weight: 800; }
.stripe { height: 4px; background: linear-gradient(to right, var(--f-blue) 0 25%, var(--f-green) 25% 50%, var(--f-yellow) 50% 75%, var(--f-red) 75% 100%); }
.pill { display: inline-flex; align-items: center; min-height: 36px; padding: 0 14px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); color: var(--fg); font-size: .85rem; font-weight: 600; text-decoration: none; }
.pill.on { background: var(--ok-soft); border-color: var(--ok); color: var(--ok); }

main { padding-block: 20px 40px; display: flex; flex-direction: column; gap: 20px; min-width: 0; }
.lead { color: var(--muted); }

/* Boutons */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 46px; padding: 0 20px; border-radius: 10px; border: 0; background: var(--accent); color: var(--accent-fg); font: inherit; font-weight: 700; text-decoration: none; cursor: pointer; }
.btn.ghost { background: var(--surface); color: var(--fg); border: 1px solid var(--line); }
.btn:disabled { opacity: .5; cursor: default; }

/* Progression */
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 16px; display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.meter { height: 10px; border-radius: 999px; background: var(--soft); overflow: hidden; }
.meter i { display: block; height: 100%; background: var(--ok); border-radius: 999px; }
.row { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.small { font-size: .88rem; color: var(--muted); }

/* Filtres */
.chips { display: flex; gap: 8px; flex-wrap: wrap; }
.chip { min-height: 40px; padding: 0 16px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); color: var(--fg); font: inherit; font-weight: 600; font-size: .92rem; cursor: pointer; }
.chip[aria-pressed="true"] { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); }

/* Cartes de cours */
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 12px; }
.card { display: flex; flex-direction: column; gap: 12px; padding: 16px; border-radius: 14px; border: 1px solid var(--line); background: var(--surface); color: var(--fg); text-decoration: none; min-width: 0; }
.card:hover { border-color: var(--accent); }
.mono { width: 46px; height: 46px; border-radius: 10px; display: grid; place-items: center; font-weight: 800; font-size: 1rem; letter-spacing: .02em; flex: none; }
.mono.langues { background: var(--sun-soft); color: var(--sun); }
.mono.info { background: var(--soft); color: var(--accent); }
.card .head { display: flex; gap: 12px; align-items: center; }
.tag { font-size: .75rem; font-weight: 700; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }

/* Liste de leçons */
.lessons { display: flex; flex-direction: column; gap: 10px; padding: 0; margin: 0; list-style: none; }
.lesson { display: flex; align-items: center; gap: 14px; padding: 14px 16px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); color: var(--fg); text-decoration: none; min-width: 0; }
.lesson .n { width: 34px; height: 34px; flex: none; border-radius: 50%; display: grid; place-items: center; font-weight: 700; background: var(--soft); color: var(--accent); }
.lesson.done .n { background: var(--ok); color: #fff; }
.lesson.lock .n { background: var(--line); color: var(--muted); }
.lesson .t { flex: 1; min-width: 0; }
.lesson .t span { display: block; font-size: .85rem; color: var(--muted); }
.state { font-size: .8rem; font-weight: 700; color: var(--muted); white-space: nowrap; }
.state.ok { color: var(--ok); }

/* Leçon */
.back { text-decoration: none; font-weight: 600; font-size: .95rem; }
.prose { display: flex; flex-direction: column; gap: 14px; max-width: 65ch; }
.tablewrap { overflow-x: auto; border: 1px solid var(--line); border-radius: 12px; background: var(--surface); }
table { border-collapse: collapse; width: 100%; font-variant-numeric: tabular-nums; }
th, td { text-align: left; padding: 10px 14px; border-bottom: 1px solid var(--line); }
tr:last-child td { border-bottom: 0; }
th { font-size: .78rem; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); background: var(--soft); }
td:first-child { font-weight: 700; }
.tip { padding: 12px 14px; border-radius: 12px; background: var(--sun-soft); border: 1px solid var(--sun); }
.quiz { display: flex; flex-direction: column; gap: 18px; }
.q { display: flex; flex-direction: column; gap: 8px; border: 0; padding: 0; margin: 0; min-width: 0; }
.q legend { padding: 0; font-weight: 700; margin-bottom: 4px; }
.opt { display: flex; align-items: center; gap: 12px; min-height: 48px; padding: 8px 14px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); cursor: pointer; }
.opt input { width: 20px; height: 20px; flex: none; accent-color: var(--accent); }
.opt.ok { background: var(--ok-soft); border-color: var(--ok); }
.opt.bad { background: var(--bad-soft); border-color: var(--bad); }
.expl { font-size: .92rem; color: var(--muted); }
.result { padding: 14px 16px; border-radius: 12px; font-weight: 600; }
.result.pass { background: var(--ok-soft); color: var(--ok); }
.result.fail { background: var(--bad-soft); color: var(--bad); }
.actions { display: flex; gap: 10px; flex-wrap: wrap; }

/* Accès complet */
.steps { margin: 0; padding-left: 1.2rem; display: flex; flex-direction: column; gap: 8px; }
.price { font-size: 2rem; font-weight: 800; letter-spacing: -0.02em; }
.price small { font-size: 1rem; font-weight: 600; color: var(--muted); }
.field { display: flex; gap: 10px; flex-wrap: wrap; }
.field input { flex: 1; min-width: 0; min-height: 46px; padding: 0 14px; border-radius: 10px; border: 1px solid var(--line); background: var(--bg); color: var(--fg); font: inherit; text-transform: uppercase; }
.msg { font-weight: 600; }
.msg.bad { color: var(--bad); }
.msg.ok { color: var(--ok); }
footer .wrap { padding-block: 0 32px; }
@media (prefers-reduced-motion: no-preference) { .meter i { transition: width .4s ease; } }
</style>
</head>

        vocab: [["A1", "Colonne A, ligne 1"], ["C4", "Colonne C, ligne 4"], ["Ligne", "Rangée horizontale, numérotée"], ["Colonne", "Rangée verticale, nommée par une lettre"], ["Cellule", "Une case du tableau"]],
        astuce: "Mettez les titres de colonnes sur la première ligne : Date, Article, Quantité, Prix.",

          { q: "Une cellule est :", choix: ["Une case du tableau", "Un fichier", "Une formule"], bonne: 0, expl: "C'est l'intersection d'une ligne et d'une colonne." }
        ]
      },
      {
        titre: "Les formules", duree: "9 min",
        intro: "Une formule commence toujours par le signe =. Elle calcule à votre place et se met à jour si les chiffres changent.",

          { q: "Que fait =B2*C2 ?", choix: ["Divise B2 par C2", "Multiplie B2 par C2", "Additionne B2 et C2"], bonne: 1, expl: "L'étoile * est le signe de la multiplication." }

      },
      {
        titre: "Votre registre de ventes", duree: "10 min",
        intro: "Créez un tableau simple : une ligne par vente, avec la date, l'article, la quantité, le prix unitaire et le total.",
        vocab: [["A", "Date"], ["B", "Article"], ["C", "Quantité"], ["D", "Prix unitaire (FCFA)"], ["E", "Total : =C2*D2"], ["Total du jour", "=SOMME(E2:E20)"]],
        astuce: "Tirez la petite poignée en bas à droite de la cellule E2 pour copier la formule sur toutes les lignes.",
        quiz: [
          { q: "Quelle formule donne le total de la ligne 2 ?", choix: ["=C2+D2", "=C2*D2", "=SOMME(C2)"], bonne: 1, expl: "Total = quantité × prix unitaire." },
          { q: "Comment obtenir le total de toutes les ventes de E2 à E20 ?", choix: ["=SOMME(E2:E20)", "=E2*E20", "=TOTAL(E2)"], bonne: 0, expl: "SOMME additionne toute la plage." },
          { q: "Pourquoi une ligne par vente ?", choix: ["Pour que le tableau soit plus long", "Pour retrouver et additionner facilement", "Parce que c'est obligatoire"], bonne: 1, expl: "Un tableau régulier se trie et se calcule facilement." }
        ]
      }
    ]
  }
];

/* ---------- État et stockage ---------- */
const KEY = "lekole-academie-v1";
let state = { done: {}, premium: false };
try { const s = JSON.parse(localStorage.getItem(KEY)); if (s && typeof s === "object") state = Object.assign(state, s); } catch (e) {}
function save() { try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {} }

const app = document.getElementById("app");
const planEl = document.getElementById("plan");
let filtre = "tous";

const $ = (s, r) => (r || document).querySelector(s);
const $$ = (s, r) => Array.from((r || document).querySelectorAll(s));
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const getCourse = id => COURSES.find(c => c.id === id);
const keyOf = (cid, n) => cid + "-" + n;
const isDone = (cid, n) => !!state.done[keyOf(cid, n)];
const isOpen = n => n === 1 || state.premium;
const totalLessons = COURSES.reduce((a, c) => a + c.lecons.length, 0);
const doneCount = () => Object.keys(state.done).length;
const courseDone = c => c.lecons.filter((_, i) => isDone(c.id, i + 1)).length;

function refreshPlan() {
  planEl.textContent = state.premium ? "Accès complet" : "Gratuit";
  planEl.classList.toggle("on", !!state.premium);
}

function nextLesson() {
  for (const c of COURSES) {
    for (let i = 0; i < c.lecons.length; i++) {
      if (!isDone(c.id, i + 1) && isOpen(i + 1)) return { c, n: i + 1 };
    }
  }
  return null;
}

/* ---------- Écrans ---------- */
function viewHome() {
  const d = doneCount();
  const pct = Math.round((d / totalLessons) * 100);
  const nx = nextLesson();
  const list = COURSES.filter(c => filtre === "tous" || c.cat === filtre);
  app.innerHTML = `
    <section style="display:flex;flex-direction:column;gap:8px">
      <h1>Apprenez les langues et l'informatique</h1>
      <p class="lead">Des leçons courtes avec un quiz à la fin. Faites-les sur votre téléphone, à votre rythme.</p>
    </section>
    <section class="panel" aria-label="Votre progression">
      <div class="row"><h2>Votre progression</h2><span class="small">${d} sur ${totalLessons} leçons</span></div>
      <div class="meter" role="progressbar" aria-valuenow="${pct}" aria-valuemin="0" aria-valuemax="100"><i style="width:${pct}%"></i></div>
      ${nx ? `<div class="row"><span class="small">Prochaine leçon : ${esc(nx.c.lecons[nx.n - 1].titre)}</span><a class="btn" href="#lecon-${nx.c.id}-${nx.n}">${d ? "Continuer" : "Commencer"}</a></div>`
           : `<p class="small">${state.premium ? "Bravo, vous avez terminé tous les cours." : "Les leçons gratuites sont terminées. Passez à l'accès complet pour continuer."}</p>${state.premium ? "" : '<a class="btn" href="#premium">Débloquer la suite</a>'}`}
    </section>
    <section style="display:flex;flex-direction:column;gap:12px">
      <div class="chips" role="group" aria-label="Filtrer les cours">
        ${[["tous", "Tous"], ["langues", "Langues"], ["info", "Informatique"]].map(([v, l]) => `<button class="chip" type="button" data-f="${v}" aria-pressed="${filtre === v}">${l}</button>`).join("")}
      </div>
      <div class="grid">
        ${list.map(c => {
          const n = courseDone(c), p = Math.round((n / c.lecons.length) * 100);
          return `<a class="card" href="#cours-${c.id}">
            <div class="head"><div class="mono ${c.cat}">${c.sigle}</div><div><div class="tag">${c.cat === "langues" ? "Langue" : "Informatique"}</div><h3>${esc(c.titre)}</h3></div></div>
            <p class="small">${esc(c.resume)}</p>
            <div class="meter"><i style="width:${p}%"></i></div>
            <span class="small">${n} sur ${c.lecons.length} leçons terminées</span>
          </a>`;
        }).join("")}
      </div>
    </section>`;
  $$(".chip").forEach(b => b.addEventListener("click", () => { filtre = b.dataset.f; viewHome(); }));
}

function viewCourse(id) {
  const c = getCourse(id);
  if (!c) return viewHome();
  app.innerHTML = `
    <a class="back" href="#accueil">← Tous les cours</a>
    <section style="display:flex;flex-direction:column;gap:8px">
      <div class="tag">${c.cat === "langues" ? "Langue" : "Informatique"}</div>
      <h1>${esc(c.titre)}</h1>
      <p class="lead">${esc(c.resume)}</p>
    </section>
    <ul class="lessons">
      ${c.lecons.map((l, i) => {
        const n = i + 1, done = isDone(c.id, n), open = isOpen(n);
        const href = open ? `#lecon-${c.id}-${n}` : "#premium";
        const cls = done ? "done" : open ? "" : "lock";
        const st = done ? '<span class="state ok">Terminée</span>' : open ? `<span class="state">${l.duree}</span>` : '<span class="state">Accès complet</span>';
        return `<li><a class="lesson ${cls}" href="${href}"><span class="n">${done ? "✓" : n}</span><span class="t">${esc(l.titre)}<span>${esc(l.intro.split(".")[0])}.</span></span>${st}</a></li>`;
      }).join("")}
    </ul>`;
}

function viewLesson(id, n) {
  const c = getCourse(id);
  if (!c || !c.lecons[n - 1]) return viewHome();
  if (!isOpen(n)) { location.hash = "premium"; return; }
  const l = c.lecons[n - 1];
  const answers = {};
  app.innerHTML = `
    <a class="back" href="#cours-${c.id}">← ${esc(c.titre)}</a>
    <section style="display:flex;flex-direction:column;gap:8px">
      <div class="tag">Leçon ${n} sur ${c.lecons.length} · ${l.duree}</div>
      <h1>${esc(l.titre)}</h1>
    </section>
    <section class="prose">
      <p>${esc(l.intro)}</p>
      <div class="tablewrap"><table><thead><tr><th>À retenir</th><th>Signification</th></tr></thead><tbody>
        ${l.vocab.map(([a, b]) => `<tr><td>${esc(a)}</td><td>${esc(b)}</td></tr>`).join("")}
      </tbody></table></div>
      <p class="tip">${esc(l.astuce)}</p>
    </section>
    <section class="panel">
      <h2>Quiz</h2>
      <p class="small">Répondez aux ${l.quiz.length} questions. Il faut au moins ${l.quiz.length - 1} bonnes réponses pour valider la leçon.</p>
      <form class="quiz" id="quiz" novalidate>
        ${l.quiz.map((q, i) => `<fieldset class="q"><legend>${i + 1}. ${esc(q.q)}</legend>
          ${q.choix.map((ch, j) => `<label class="opt" for="q${i}-${j}"><input type="radio" id="q${i}-${j}" name="q${i}" value="${j}"><span>${esc(ch)}</span></label>`).join("")}
          <p class="expl" id="e${i}" hidden></p></fieldset>`).join("")}
        <p class="msg bad" id="warn" hidden>Répondez à toutes les questions avant de vérifier.</p>
        <div class="actions"><button class="btn" type="submit" id="check">Vérifier mes réponses</button></div>
      </form>
      <div id="out"></div>
    </section>`;

  $$('input[type="radio"]').forEach(r => r.addEventListener("change", () => { answers[r.name] = Number(r.value); $("#warn").hidden = true; }));
  $("#quiz").addEventListener("submit", e => {
    e.preventDefault();
    if (l.quiz.some((_, i) => answers["q" + i] === undefined)) { $("#warn").hidden = false; return; }
    let score = 0;
    l.quiz.forEach((q, i) => {
      const ok = answers["q" + i] === q.bonne;
      if (ok) score++;
      $$(`input[name="q${i}"]`).forEach(inp => {
        inp.disabled = true;
        const lab = inp.closest(".opt");
        if (Number(inp.value) === q.bonne) lab.classList.add("ok");
        else if (inp.checked) lab.classList.add("bad");
      });
      const ex = $("#e" + i); ex.hidden = false; ex.textContent = (ok ? "Bonne réponse. " : "Ce n'est pas la bonne réponse. ") + q.expl;
    });
    $("#check").hidden = true;
    const pass = score >= l.quiz.length - 1;
    if (pass) { state.done[keyOf(c.id, n)] = Math.max(score, state.done[keyOf(c.id, n)] || 0); save(); }
    const hasNext = n < c.lecons.length;
    const nextBtn = hasNext
      ? `<a class="btn" href="${isOpen(n + 1) ? `#lecon-${c.id}-${n + 1}` : "#premium"}">${isOpen(n + 1) ? "Leçon suivante" : "Débloquer la suite"}</a>`
      : `<a class="btn" href="#cours-${c.id}">Terminer le cours</a>`;
    $("#out").innerHTML = `
      <div class="result ${pass ? "pass" : "fail"}">${score} sur ${l.quiz.length}. ${pass ? "Leçon validée, bravo." : "Relisez la leçon et réessayez."}</div>
      <div class="actions" style="margin-top:12px">${pass ? nextBtn : ""}<button class="btn ghost" type="button" id="retry">${pass ? "Refaire le quiz" : "Réessayer"}</button></div>`;
    $("#retry").addEventListener("click", () => viewLesson(id, n));
  });
}

function viewPremium() {
  const locked = COURSES.reduce((a, c) => a + c.lecons.length - 1, 0);
  const pay = CONFIG.paiements.map(p => `<li><b>${esc(p.nom)}</b> : ${p.numero ? esc(p.numero) : "numéro à venir"}</li>`).join("");
  app.innerHTML = `
    <a class="back" href="#accueil">← Retour</a>
    <section style="display:flex;flex-direction:column;gap:8px">
      <h1>Accès complet</h1>
      <p class="lead">${state.premium ? "Votre accès complet est activé. Toutes les leçons sont ouvertes." : `Ouvrez les ${locked} leçons suivantes des ${COURSES.length} cours. La première leçon de chaque cours reste gratuite.`}</p>
    </section>
    ${state.premium ? '<a class="btn" href="#accueil">Retour aux cours</a>' : `
    <section class="panel">
      <div class="price">${esc(CONFIG.prix)} <small>${esc(CONFIG.periode)}</small></div>
      <h2>Comment payer</h2>
      <ol class="steps">
        <li>Envoyez le montant par Mobile Money à l'un des numéros ci-dessous.</li>
        <li>Envoyez la référence du paiement ${CONFIG.whatsapp ? `par WhatsApp au ${esc(CONFIG.whatsapp)}` : "par WhatsApp (numéro à venir)"}.</li>
        <li>Vous recevez un code d'accès. Saisissez-le plus bas.</li>
      </ol>
      <ul class="steps" style="list-style:none;padding:0">${pay}</ul>
    </section>
    <section class="panel">
      <h2>J'ai un code d'accès</h2>
      <form class="field" id="codeform" novalidate>
        <label class="small" for="code" style="width:100%">Code d'accès</label>
        <input id="code" type="text" autocomplete="off" autocapitalize="characters" placeholder="LEKOLE-XXXX">
        <button class="btn" type="submit">Activer</button>
      </form>
      <p class="msg" id="codemsg" hidden></p>
    </section>`}`;
  const f = $("#codeform");
  if (f) f.addEventListener("submit", e => {
    e.preventDefault();
    const v = $("#code").value.trim().toUpperCase();
    const m = $("#codemsg"); m.hidden = false;
    if (CONFIG.codes.includes(v)) {
      state.premium = true; save(); refreshPlan(); viewPremium();
    } else { m.className = "msg bad"; m.textContent = "Ce code n'est pas valide. Vérifiez-le et réessayez."; }
  });
}

/* ---------- Navigation ---------- */
function route() {
  const p = (location.hash || "#accueil").slice(1).split("-");
  if (p[0] === "cours") viewCourse(p[1]);
  else if (p[0] === "lecon") viewLesson(p[1], parseInt(p[2], 10));
  else if (p[0] === "premium") viewPremium();
  else viewHome();
  refreshPlan();
  window.scrollTo(0, 0);
}
window.addEventListener("hashchange", route);
route();
</script>

<script>
if ("serviceWorker" in navigator && location.protocol.indexOf("http") === 0) {
  window.addEventListener("load", function () {
    navigator.serviceWorker.register("sw.js").catch(function () {});
  });
}
</script>
